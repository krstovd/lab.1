<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
    <style>
        body {
            width: 500px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
        }
        input, select, button {
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 th:text="${book != null} ? 'Edit Book' : 'Add New Book' "></h1>

    <form th:action="@{${book != null} ? '/books/edit/' + ${book.id} : '/books/add'}" method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" th:value="${book != null} ? ${book.title} : ''" required>

        <label for="genre">Genre:</label>
        <input type="text" id="genre" name="genre" th:value="${book != null} ? ${book.genre} : ''" required>

        <label for="averageRating">Average Rating:</label>
        <input type="number" step="0.1" id="averageRating" name="averageRating" th:value="${book != null} ? ${book.averageRating} : ''" required>

        <label for="authorId">Author:</label>
        <select id="authorId" name="authorId" required>
            <option th:each="author : ${authors}" th:value="${author.id}"
                    th:text="${author.name + ' ' + author.surname}"
                    th:selected="${book != null} ? ${author.id} == ${book.author.id} : false">
            </option>
        </select>

        <button type="submit" th:text="${book != null} ? 'Update Book' : 'Add Book'"></button>
    </form>
</body>
</html>
