<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Book Management - List Books</title>
    <style type="text/css">
        body {
            width: 900px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        .search-form {
            margin: 20px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .search-form input[type="text"] {
            width: 300px;
            padding: 8px;
            margin-right: 10px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, td, th {
            border: 1px solid #333;
        }
        th {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
        }
        td {
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .btn {
            padding: 8px 16px;
            text-decoration: none;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-add {
            background-color: #4CAF50;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-search {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
<header>
    <h1>Book Management System</h1>
</header>
<main>
    <a href="/books/add" class="btn btn-add">Add New Book</a>

    <div class="search-form">
        <form method="GET" action="/books">
            <label>Search by title:</label>
            <input type="text" name="searchText" placeholder="Enter book title...">
            <button type="submit" class="btn btn-search">Search</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Avg Rating</th>
        </tr>
        </thead>
        <tbody>
        <!-- Use Thymeleaf to iterate over books and display them -->
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.genre}"></td>
                <td th:text="${book.averageRating}"></td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
