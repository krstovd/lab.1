<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Book Management - Add Book</title>
    <style type="text/css">
        body {
            width: 600px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="number"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-cancel {
            background-color: #f44336;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<header>
    <h1>Add New Book</h1>
</header>
<main>
    <form method="POST" action="/books/add">
        <label>Title:</label>
        <input type="text" name="title" required><br/>

        <label>Genre:</label>
        <input type="text" name="genre" required><br/>

        <label>Avg Rating:</label>
        <input type="number" name="averageRating" required><br/>

        <button type="submit" class="btn">Save</button>
        <a href="/books" class="btn btn-cancel">Cancel</a>
    </form>
</main>
</body>
</html>
